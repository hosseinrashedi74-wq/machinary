name: Build Universal Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean App & Inject Code
        run: |
          cd ..
          flutter create --org com.mashinaryar --project-name mashinaryar app_build
          if [ -f machinary/lib/main.dart ]; then
            cp machinary/lib/main.dart app_build/lib/main.dart
          elif [ -f machinary/main.dart ]; then
            cp machinary/main.dart app_build/lib/main.dart
          fi
          cd app_build
          flutter build apk --release
          mkdir -p ../machinary/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk ../machinary/build/app/outputs/flutter-apk/

      - name: Upload APK Ready for Download
        uses: actions/upload-artifact@v4
        with:
          name: Mashinaryar-Universal-APK
          path: build/app/outputs/flutter-apk/app-release.apk
