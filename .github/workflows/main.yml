name: Build Universal Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Assemble Flutter Project
        run: |
          mkdir -p /tmp/build_app
          cd /tmp/build_app
          flutter create --org com.mashinaryar --project-name mashinaryar app
          cd app
          # انتقال کد اصلی به پروژه جدید
          if [ -f "$GITHUB_WORKSPACE/main.dart" ]; then
            cp "$GITHUB_WORKSPACE/main.dart" lib/main.dart
          elif [ -f "$GITHUB_WORKSPACE/lib/main.dart" ]; then
            cp "$GITHUB_WORKSPACE/lib/main.dart" lib/main.dart
          fi
          flutter build apk --release --no-tree-shake-icons
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/output/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mashinaryar-Universal-APK
          path: output/app-release.apk
